<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of Two Numbers</title>
    <script>
        function hello() {
            let a = parseInt(prompt("Enter value of a:"));
            let b = parseInt(prompt("Enter value of b:"));
            let c = a + b;
            document.write(c);
        }
    </script>
</head>
<body>
    <input type="button" onclick="hello()" value="Add Numbers">
    <p id="result"></p>
</body>
</html>
