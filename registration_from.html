<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABES 2ND YEAR</title>
  <link rel="stylesheet" href="style_1.css">
</head>
<body style="background-image: url('abes.jpg'); background-size: cover; background-position: center; height: auto ; width:auto;">

  <div class="form-container">
    <h2><span class="title-color">ABES 2ND YEAR</span></h2>
    <form  method="post">
      <label for="firstname">FIRST Name</label>
      <input type="text" id="firstname" name="firstname" required>
      <br>

      <label for="lastname">LAST Name</label>
      <input type="text" id="lastname" name="lastname" required>
      <br>

      <label for="email">EMAIL</label>
      <input type="email" id="email" name="email" required>
      <br>

      <label for="password">PASSWORD</label>
      <input type="password" id="password" name="password" required>
      <br>

      <label for="gender">GENDER</label>
      <input type="text" id="gender" name="gender">
      <br>

      <label for="contact">CONTACT</label>
      <input type="tel" id="contact" name="contact">
      <br>

      <label for="course">COURSE</label>
      <select id="course" name="course" required>
        <option value="">Select Course</option>
        <option value="cse">B.TECH</option>
        <option value="ece">M.TECH</option>
        <option value="mech">MSC.(COMPUTER SCIENCE)</option>
      </select>
      <br>

      <hr><hr>
    </form>
  </div>
</body>
</html>
